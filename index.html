<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayEasy Hotel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>StayEasy 🏨</h1>
    <nav>
        <a href="#home">Home</a>
        <a href="#rooms">Rooms</a>
        <a href="#booking">Booking</a>
    </nav>
</header>

<section class="hero" id="home">
    <h2>Find Your Perfect Stay</h2>
    <p>Enjoy comfort and luxury at affordable prices.</p>
    <a href="#rooms" class="btn">Explore Rooms</a>
</section>

<section id="rooms">
    <h2>Our Rooms</h2>

    <div class="rooms">
        <div class="room">
            <img src="https://images.unsplash.com/photo-1611892440504-42a792e24d32?w=600" alt="Single room">
            <h3>Single Room</h3>
            <p>₹1500 / Night</p>
            <button onclick="selectRoom(1500)">Book Now</button>
        </div>

        <div class="room">
            <img src="https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?w=600" alt="Double room">
            <h3>Double Room</h3>
            <p>₹2500 / Night</p>
            <button onclick="selectRoom(2500)">Book Now</button>
        </div>

        <div class="room">
            <img src="https://images.unsplash.com/photo-1611892440504-42a792e24d32?w=600" alt="Deluxe room">
            <h3>Deluxe Room</h3>
            <p>₹4000 / Night</p>
            <button onclick="selectRoom(4000)">Book Now</button>
        </div>
    </div>
</section>

<section id="booking">
    <h2>Book Your Room</h2>

    <form id="bookingForm">
        <input id="name" placeholder="Your Name" required>
        <input id="email" type="email" placeholder="Your Email" required>

        <select id="roomPrice">
            <option value="1500">Single Room - ₹1500</option>
            <option value="2500">Double Room - ₹2500</option>
            <option value="4000">Deluxe Room - ₹4000</option>
        </select>

        <label>Check-in</label>
        <input type="date" id="checkin" required>

        <label>Check-out</label>
        <input type="date" id="checkout" required>

        <h3 id="total">Total: ₹0</h3>

        <button type="submit">Confirm Booking</button>
    </form>

    <p id="message"></p>
</section>

<footer>© 2026 StayEasy Hotel</footer>

<script src="script.js"></script>
</body>
</html>
